[workspace]
resolver = "2"
members = [
    "crates/blazar-core",
    "crates/blazar-calibration",
    "crates/blazar-encoder",
    "crates/blazar-sink",
    "crates/blazar-preprocess",
    "crates/blazar-runtime",
]
[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"

# Shared dependency versions. Pinned (see project rules: exact/pinned versions).
[workspace.dependencies]
thiserror = "=2.0.21"
serde = { version = "=1.0.229", features = ["derive"] }
toml = "=1.1.8"
tracing = "=0.1.44"
oxideav-core = "=0.1.40"
oxideav-mp4 = { git = "https://github.com/jgh-/oxideav-mp4", rev = "9b6f7bb6a0dee7de72b8e593cb1feba5f14034e6" }
# NVENC (Phase 2). Fork pinned by rev: adds EncodePictureParams::encode_pic_flags
# (forced IDR) and Buffer::pitch() to the upstream 0.4.0 wrapper.
nvidia-video-codec-sdk = { git = "https://github.com/jgh-/nvidia-video-codec-sdk", rev = "2a6d4cd8f3623935a9db2888aa538f819bf889b3" }
# The SDK's published 0.4.0 pins cudarc 0.16.6, which rejects CUDA 13. The git
# revision depends on cudarc 0.19; pin it with the explicit toolkit feature.
cudarc = { version = "=0.19.10", default-features = false, features = ["cuda-13010", "driver", "dynamic-loading"] }

# Internal crates
blazar-core = { path = "crates/blazar-core" }
blazar-calibration = { path = "crates/blazar-calibration" }
blazar-encoder = { path = "crates/blazar-encoder" }
blazar-sink = { path = "crates/blazar-sink" }
blazar-preprocess = { path = "crates/blazar-preprocess" }

[profile.release]
lto = "thin"
codegen-units = 1
