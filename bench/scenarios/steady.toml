# Steady-state throughput. The source is a (1,3,T,H,W) device tensor already
# resident: nothing here uploads source frames, and session open is excluded from
# every per-frame figure.

[corpus]
# Identity only; the runner resolves the actual frames.
name = "ltx-2.5"
frames = 48

[[rows]]
label = "device-720p"
backend = "nvenc"
codec = "h264"
preprocess = "device"
width = 1280
height = 720

[[rows]]
label = "device-1088p"
backend = "nvenc"
codec = "h264"
preprocess = "device"
width = 1920
height = 1088

[[rows]]
label = "host-1088p"
backend = "nvenc"
codec = "h264"
preprocess = "host"
width = 1920
height = 1088
