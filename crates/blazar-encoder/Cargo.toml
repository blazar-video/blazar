[package]
name = "blazar-encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blazar-core.workspace = true
blazar-calibration.workspace = true
blazar-preprocess.workspace = true
thiserror.workspace = true
tracing.workspace = true
nvidia-video-codec-sdk = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }

[features]
default = []
# Real SVT-AV1 backend via FFI. Off by default so the workspace builds and
# tests run without libsvtav1 installed; the mock backend covers the pipeline
# contract until the bindings land.
svtav1 = []
# Hardware AV1 via NVENC. Needs an NVIDIA GPU + CUDA toolkit at build time; the
# default build stays platform-neutral. Pinned to CUDA 13.1 through cudarc's
# cuda-13010 feature.
nvenc = ["dep:nvidia-video-codec-sdk", "dep:cudarc"]
