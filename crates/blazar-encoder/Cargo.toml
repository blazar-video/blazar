[package]
name = "blazar-encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blazar-x265-sys = { path = "../blazar-x265-sys", optional = true }
# Probing for libcuda before cudarc touches it: cudarc panics when the driver
# library is absent, and a panic in a worker thread is not an error a caller can
# handle. This is only a file-existence check by another name.
libloading = "0.8"
blazar-core.workspace = true
blazar-calibration.workspace = true
blazar-preprocess.workspace = true
thiserror.workspace = true
tracing.workspace = true
nvidia-video-codec-sdk = { workspace = true, optional = true }
cudarc = { workspace = true, optional = true }

[dependencies.blazar-svtav1-sys]
path = "../blazar-svtav1-sys"
optional = true

[dependencies.blazar-vpx-sys]
path = "../blazar-vpx-sys"
optional = true

[dependencies.x264]
version = "0.5"
optional = true

[dependencies.x264-sys]
version = "0.2"
optional = true

[features]
default = []
# Real SVT-AV1 backend via FFI. Off by default so the workspace builds and
# tests run without libsvtav1 installed; the mock backend covers the pipeline
# contract until the bindings land.
svtav1 = ["enc-svtav1"]
# Software AV1 via SVT-AV1 (BSD). The bindings crate generates from the system
# header, so libsvtav1 must be installed to build this feature.
enc-svtav1 = ["dep:blazar-svtav1-sys"]
# Apple VideoToolbox H.264/HEVC (macOS only). Links the system frameworks, so
# it adds no build-time dependency on other platforms.
enc-videotoolbox = []
# Software VP9 via libvpx (BSD). Needs libvpx at build time.
enc-vp9 = ["dep:blazar-vpx-sys"]
# Opus audio. BSD-3, so unlike x264/x265 this can ship in a permissive wheel.
enc-opus = ["dep:opus"]
# Software H.264 (x264). GPL: enabling this makes the resulting binary GPL.
enc-x264 = ["dep:x264", "dep:x264-sys"]
# Software HEVC (x265). GPL: enabling this makes the resulting binary GPL.
enc-x265 = ["dep:blazar-x265-sys"]
# Hardware AV1 via NVENC. Needs an NVIDIA GPU + CUDA toolkit at build time; the
# default build stays platform-neutral. Pinned to CUDA 13.1 through cudarc's
# cuda-13010 feature.
nvenc = ["dep:nvidia-video-codec-sdk", "dep:cudarc"]

[dependencies.opus]
version = "=0.3.1"
optional = true
