[package]
name = "blazar-encoder"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blazar-core.workspace = true
blazar-calibration.workspace = true
blazar-preprocess.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
default = []
