[package]
name = "blazar-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blazar-core.workspace = true
blazar-calibration.workspace = true
blazar-encoder.workspace = true
blazar-sink.workspace = true
blazar-preprocess.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# Apple VideoToolbox H.264/HEVC (macOS only).
enc-videotoolbox = ["blazar-encoder/enc-videotoolbox"]
default = []
# Forward the hardware encoder. Enables `blazar-encoder/nvenc` and the backend
# selection path that uses it.
nvenc = ["blazar-encoder/nvenc"]
# Software H.264. GPL: enabling this opts the binary into x264's licence.
enc-x264 = ["blazar-encoder/enc-x264"]
enc-x265 = ["blazar-encoder/enc-x265"]
# Software AV1 via SVT-AV1 (BSD).
enc-svtav1 = ["blazar-encoder/enc-svtav1"]
# Software VP9 via libvpx (BSD).
enc-vp9 = ["blazar-encoder/enc-vp9"]
enc-opus = ["blazar-encoder/enc-opus"]
# Feed CPU encoders from the GPU preprocess stage. Needs CUDA (the encoder crate's
# nvenc feature carries cudarc), so it is opt-in.
gpu-preprocess = ["blazar-encoder/nvenc"]
