[package]
name = "nvenc-spike"
version = "0.0.0"
edition = "2021"

[dependencies]
# Published 0.4.0 pins cudarc 0.16.6 (no CUDA 13 support). Use git main, which
# depends on cudarc 0.19, and pin cudarc here with the CUDA 13.1 feature +
# dynamic loading so no compile-time CUDA-version gate applies.
nvidia-video-codec-sdk = { git = "https://github.com/ViliamVadocz/nvidia-video-codec-sdk" }
cudarc = { version = "=0.19.10", default-features = false, features = ["cuda-13010", "driver", "dynamic-loading"] }
