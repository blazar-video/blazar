[package]
name = "blazar-python"
version = "0.0.0"
edition = "2021"
rust-version = "1.95"
publish = false

# Its own workspace: maturin builds with `extension-module`, which deliberately
# does not link libpython and therefore breaks `cargo test` linking. Keeping this
# crate out of the main workspace means `cargo test --workspace` stays portable
# and CUDA-free.
[workspace]

[lib]
name = "_blazar"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["extension-module"] }
# Session logs must come from the Rust worker, not from Python print statements,
# so "Blazar encoded this" is verifiable from the encoder's own side.
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
blazar-core = { path = "../../crates/blazar-core" }
blazar-calibration = { path = "../../crates/blazar-calibration" }
blazar-encoder = { path = "../../crates/blazar-encoder" }
blazar-runtime = { path = "../../crates/blazar-runtime" }
blazar-sink = { path = "../../crates/blazar-sink" }

[features]
default = []
# Hardware AV1. Build with `maturin develop --features nvenc` on a CUDA host.
nvenc = ["blazar-encoder/nvenc", "blazar-runtime/nvenc"]
# CPU codecs. Each needs its library at build time (see the encoder crate).
enc-svtav1 = ["blazar-encoder/enc-svtav1", "blazar-runtime/enc-svtav1"]
enc-x264 = ["blazar-encoder/enc-x264", "blazar-runtime/enc-x264"]
enc-x265 = ["blazar-encoder/enc-x265", "blazar-runtime/enc-x265"]
enc-vp9 = ["blazar-encoder/enc-vp9", "blazar-runtime/enc-vp9"]
# GPU preprocessing for CPU codecs (device tensors).
gpu-preprocess = ["nvenc", "blazar-runtime/gpu-preprocess"]
