[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "blazar-video"
version = "0.0.0"
description = "Python bindings for the Blazar model-aware video encoder harness"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }

[tool.setuptools.package-data]
blazar = ["py.typed", "*.pyi"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "blazar._blazar"
python-source = "python"
