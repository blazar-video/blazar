[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "blazar-video"
version = "0.1.0"
description = "Model-aware video encoding for generated video: zero-copy GPU ingest, per-model calibrations, and one submit for host or device frames"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
keywords = ["video", "encoding", "nvenc", "av1", "h264", "hevc", "diffusion", "torch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video :: Conversion",
    "Topic :: Multimedia :: Video :: Non-Linear Editor",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/blazar-video/blazar"
Documentation = "https://github.com/blazar-video/blazar/blob/main/docs/python-api.md"
Changelog = "https://github.com/blazar-video/blazar/blob/main/CHANGELOG.md"
Issues = "https://github.com/blazar-video/blazar/issues"

[tool.maturin]
# maturin copies python/ into the wheel, but only .py files; the stubs and the
# PEP 561 marker have to be listed explicitly.
include = [
    { path = "python/blazar/py.typed", format = "wheel" },
    { path = "python/blazar/__init__.pyi", format = "wheel" },
]
features = ["pyo3/extension-module"]
module-name = "blazar._blazar"
python-source = "python"

[tool.pytest.ini_options]
# Tests that need a real encoder. Hosted CI deselects them; the hardware workflow
# selects them on a self-hosted runner.
markers = [
    "hardware: needs a real encoder session (NVENC or VideoToolbox)",
    "acceptance: the release gate; every backend, dtype and frame location",
]
