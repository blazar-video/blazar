name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # audiopus_sys vendors opus 1.3, whose CMakeLists declares
  # cmake_minimum_required(3.1); CMake 4 refuses anything below 3.5.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  rust:
    # The portable surface: no NVENC, no VideoToolbox, no codec SDK headers.
    # Everything here must pass on a machine with no GPU, because that is what a
    # hosted runner is.
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      # The calibration tests read the shipped defaults from their own repo.
      BLAZAR_CALIBRATIONS: ${{ github.workspace }}/calibrations/default
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/calibrations
          path: calibrations
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      # The -sys crates are FFI bindings whose build scripts require libvpx,
      # x265 and SVT-AV1 headers. Linting them would mean installing GPL
      # libraries on every runner for no signal; the x264 job exercises a real
      # encoder end to end instead.
      - run: cargo clippy --workspace --all-targets --exclude blazar-vpx-sys --exclude blazar-x265-sys --exclude blazar-svtav1-sys -- -D warnings
      - run: cargo test --workspace --exclude blazar-vpx-sys --exclude blazar-x265-sys --exclude blazar-svtav1-sys
      - run: cargo doc --workspace --exclude blazar-vpx-sys --exclude blazar-x265-sys --exclude blazar-svtav1-sys --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  rust-x264:
    # A CPU codec end to end, so the encoder seam is not only ever exercised by
    # the mock. Linux only: the dependency is a stock apt package there.
    name: rust (x264)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libx264-dev pkg-config
      - run: cargo test -p blazar-encoder -p blazar-runtime --features enc-x264

  python:
    # Builds the extension and runs the tests that need no GPU. The hardware
    # suites (NVENC, VideoToolbox) run on a self-hosted runner; see
    # .github/workflows/hardware.yml and RELEASING.md.
    name: python (${{ matrix.os }}, ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    env:
      # audiopus_sys vendors opus 1.3, whose CMakeLists declares
      # cmake_minimum_required(3.1) — rejected by CMake 4. This is the documented
      # escape hatch and is only about the policy floor, not the C standard.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/calibrations
          path: calibrations
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Dependencies come first: the build links against vpx and svt-av1, so
      # installing them afterwards only ever produced a failed build.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential pkg-config ffmpeg libopus-dev nasm git
          sudo apt-get install -y libsvtav1-dev || sudo apt-get install -y libsvtav1enc-dev
          # Build libvpx rather than take the distro's: 24.04 ships 1.14, whose
          # headers our bindings do not match, and 1.16 is what the encoder is
          # developed and benchmarked against.
          git clone --depth 1 --branch v1.16.0 https://chromium.googlesource.com/webm/libvpx /tmp/vpx
          cd /tmp/vpx && ./configure --prefix=/usr --libdir=/usr/lib --disable-examples \
            --disable-tools --disable-docs --disable-unit-tests --disable-install-bins
          make -j"$(nproc)" && sudo make install
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake svt-av1 libvpx pkg-config
          {
            echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/opt/svt-av1/lib/pkgconfig:$(brew --prefix)/opt/libvpx/lib/pkgconfig"
          } >> "$GITHUB_ENV"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          # No manylinux container here: the point is to install and test the
          # wheel, and inside the container maturin builds for the container's
          # interpreter (cp39), which the runner's python cannot install.
          manylinux: "off"
          args: ${{ runner.os == 'macOS' && '--release --out dist --features enc-svtav1,enc-vp9,opus' || '--release --out dist --features nvenc,gpu-preprocess,enc-svtav1,enc-vp9,opus' }}
      # maturin ran with working-directory bindings/python, so the wheel is there
      - run: pip install bindings/python/dist/*.whl pytest numpy
      - name: tests that need no encoder hardware
        env:
          BLAZAR_CALIBRATIONS: ${{ github.workspace }}/calibrations/default
        # test_encoder/test_memory_sink drive the mock backend. Everything else
        # in tests/ opens a real session, which a hosted runner cannot do.
        run: python -m pytest bindings/python/tests/test_encoder.py bindings/python/tests/test_memory_sink.py -q
      - name: acceptance suite
        env:
          BLAZAR_ACCEPTANCE_FLAVOUR: ${{ runner.os == 'macOS' && 'blazar-video-macos' || 'blazar-video' }}
          BLAZAR_CALIBRATIONS: ${{ github.workspace }}/calibrations/default
        run: python -m pytest bindings/python/tests/test_acceptance.py -q

  commit-hygiene:
    name: license headers and secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: no committed artifacts
        run: |
          if git ls-files | grep -E '(\.DS_Store|\.pyc$|/target/|\.mp4$|\.mkv$)'; then
            echo "::error::committed build or media artifacts"
            exit 1
          fi
      - name: versions agree, and the changelog has a section for them
        # Four files state the version and the release workflow reads the
        # changelog; a mismatch publishes a wheel whose name disagrees with its
        # metadata, which is only discovered after the upload.
        run: python3 scripts/check_versions.py
      - name: SPDX on every Rust source
        run: |
          missing=$(grep -rL "SPDX-License-Identifier" --include='*.rs' crates bindings || true)
          if [ -n "$missing" ]; then
            echo "::error::missing SPDX headers:"; echo "$missing"; exit 1
          fi
