name: Release (GPL)

# The copyleft distribution: same crate, built with x264/x265, published as
# `blazar-video-gpl` under GPL-3.0-or-later. Separate workflow and separate
# publisher so this can never be confused with the Apache release.
#
# Legal basis: x264 and x265 are GPL-2.0-or-later, so the Apache-2.0 core may be
# combined into a GPLv3 work. See PUBLISHING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (no publish on manual runs)"
    
permissions:
  contents: write
  id-token: write

# Disabled on purpose: the GPL wheel currently builds an extension with no
# `blazar` package around it, because maturin will not copy a `python-source`
# that lives outside the project (it rejects `..` paths). Shipping that wheel
# would give users an importable-looking package that fails on first use. Re-enable
# once packaging/gpl has its own manifest next to the Python package; see
# PUBLISHING.md, "GPL distribution".
jobs:
  wheels:
    if: ${{ false }}
    name: gpl wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      # audiopus_sys vendors opus 1.3, whose CMakeLists declares
      # cmake_minimum_required(3.1) — rejected by CMake 4. This is the documented
      # escape hatch and is only about the policy floor, not the C standard.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: manylinux_2_28_x86_64
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            setup: sudo apt-get update && sudo apt-get install -y libx264-dev libx265-dev pkg-config
            features: nvenc,gpu-preprocess,enc-svtav1,enc-vp9,enc-x264,enc-x265,opus
          - os: macos-latest
            platform: macosx_11_0_arm64
            target: aarch64-apple-darwin
            manylinux: auto
            setup: brew install x264 x265 pkg-config
            features: enc-videotoolbox,enc-x264,enc-x265,opus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: ${{ matrix.setup }}
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake x264 x265
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: packaging/gpl
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          before-script-linux: |
            if command -v dnf >/dev/null; then
              dnf install -y cmake gcc gcc-c++ make nasm git clang clang-libs opus-devel libx264-devel libx265-devel || true
              # The distro libvpx is 1.7, and the bindings are generated from
              # 1.16 — the build script refuses anything below 1.15 rather than
              # writing past a shorter struct, so build the version we target.
              git clone --depth 1 --branch v1.16.0 https://chromium.googlesource.com/webm/libvpx /tmp/vpx
              # Subshell: this script shares its shell with maturin, so a `cd`
              # that is not scoped here leaves maturin looking for /Cargo.toml.
              ( cd /tmp/vpx && ./configure --prefix=/usr --libdir=/usr/lib \
                  --disable-examples --disable-tools --disable-docs \
                  --disable-unit-tests --disable-install-bins \
                && make -j"$(nproc)" && make install )
              export PKG_CONFIG_PATH=/usr/lib/pkgconfig:$PKG_CONFIG_PATH
              dnf install -y libx264-devel libx265-devel || true
              if ! pkg-config --exists SvtAv1Enc; then
                # AlmaLinux has no svt-av1 package; build it, as the wheel needs
                # it at link time. Install to /usr so its .pc lands in the
                # default pkg-config path rather than somewhere unsearched.
                git clone --depth 1 --branch v2.3.0 https://gitlab.com/AOMediaCodec/SVT-AV1.git /tmp/svt
                cmake -S /tmp/svt -B /tmp/svt/build -DCMAKE_BUILD_TYPE=Release \
                      -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=/usr
                cmake --build /tmp/svt/build -j"$(nproc)"
                cmake --install /tmp/svt/build
                export PKG_CONFIG_PATH=/usr/lib64/pkgconfig:/usr/lib/pkgconfig:$PKG_CONFIG_PATH
              fi
            elif command -v apt-get >/dev/null; then
              apt-get update && apt-get install -y cmake build-essential libvpx-dev libsvtav1-dev
            fi
          args: --release --out dist --features pyo3/extension-module,${{ matrix.features }}
      - uses: actions/upload-artifact@v4
        with:
          name: gpl-wheels-${{ matrix.platform }}
          path: packaging/gpl/dist/*.whl

  sdist:
    # The GPL requires corresponding source. Published with the wheels, not
    # instead of them.
    name: gpl sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake x264 x265
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: packaging/gpl
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: gpl-sdist
          path: packaging/gpl/dist/*.tar.gz

  smoke:
    if: ${{ false }}
    name: smoke (the GPL encoders are present)
    runs-on: ubuntu-latest
    env:
      # audiopus_sys vendors opus 1.3, whose CMakeLists declares
      # cmake_minimum_required(3.1) — rejected by CMake 4. This is the documented
      # escape hatch and is only about the policy floor, not the C standard.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/calibrations
          path: calibrations
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y cmake build-essential ffmpeg libvpx-dev libx264-dev libx265-dev && (sudo apt-get install -y libsvtav1-dev || sudo apt-get install -y libsvtav1enc-dev)
      - run: pip install maturin
      - run: cd packaging/gpl && maturin build --release --features pyo3/extension-module,nvenc,gpu-preprocess,enc-svtav1,enc-vp9,enc-x264,enc-x265,opus --out dist
      - run: pip install packaging/gpl/dist/*.whl pytest numpy
      - run: |
          python - <<'PY'
          import blazar
          present = set(blazar.backends())
          print("blazar", blazar.__version__, "backends:", sorted(present))
          missing = {"x264", "x265"} - present
          assert not missing, f"GPL wheel is missing {sorted(missing)}; got {sorted(present)}"
          PY
      - name: acceptance suite
        env:
          BLAZAR_ACCEPTANCE_FLAVOUR: blazar-video-gpl
          BLAZAR_CALIBRATIONS: ${{ github.workspace }}/calibrations/default
        run: python -m pytest bindings/python/tests/test_acceptance.py -q

  publish:
    needs: [wheels, sdist, smoke]
    runs-on: ubuntu-latest
    environment: pypi-gpl
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gpl-*
          merge-multiple: true
          path: dist
      - run: pip install twine && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
