name: Release GPL

# The GPL distribution: the same code as `blazar-video`, built with the GPL
# encoders (x264, x265) and published under GPL-3.0-or-later.
#
# maturin cannot build it directly. Its `python-source` handling copies the
# Python package only when the crate being built lives inside the project, and
# `packaging/gpl` necessarily points `manifest-path` at `bindings/python`; the
# wheel it produced contained the extension and no `blazar/__init__.py`. So the
# wheel is built from `bindings/python` with the GPL features on, and
# `scripts/gpl_wheel.py` rewrites the five things that make it a different
# distribution: filename, dist-info, Name, licence, NOTICE, RECORD.
#
# Source builds do not need that dance:
#   MATURIN_PEP517_ARGS="--features enc-x264,enc-x265" pip install ./bindings/python

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  # audiopus_sys vendors opus 1.3, whose CMakeLists declares
  # cmake_minimum_required(3.1); CMake 4 refuses anything below 3.5.
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  wheels:
    name: gpl wheel (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: manylinux_2_28_x86_64
            manylinux: "2_28"
          - platform: manylinux_2_28_aarch64
            manylinux: "2_28"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: build the wheel
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          manylinux: ${{ matrix.manylinux }}
          # `repair` bundles libx264/libx265 into the wheel. Without it the
          # import fails on any machine that has not installed the same
          # libraries, and a wheel that only works on the build host is not a
          # wheel.
          args: --release --out dist --auditwheel=repair
                --features nvenc,gpu-preprocess,enc-svtav1,enc-vp9,enc-x264,enc-x265,opus
          before-script-linux: |
            if command -v dnf >/dev/null; then
              # AlmaLinux has no libx264/libx265 packages; build them. Every
              # network and build step is bounded, because a stalled clone once
              # hung this job for twenty minutes with nothing to show for it.
              dnf install -y cmake gcc gcc-c++ make nasm git clang clang-libs opus-devel || true

              timeout 180 git clone --depth 1 --branch stable \
                https://code.videolan.org/videolan/x264.git /tmp/x264
              ( cd /tmp/x264 && ./configure --prefix=/usr --libdir=/usr/lib \
                  --enable-shared --disable-cli \
                && timeout 600 make -j"$(nproc)" && make install )

              # x265 4.2 exactly: `blazar-x265-sys` pins the struct layouts that
              # bindgen produced from 4.2 headers, because bindgen 0.69 with
              # clang 19 writes opaque structs. Linking a different libx265
              # would read and write the wrong offsets.
              timeout 240 git clone --depth 1 --branch 4.2 \
                https://bitbucket.org/multicoreware/x265_git /tmp/x265
              cmake -S /tmp/x265/source -B /tmp/x265/build -DCMAKE_BUILD_TYPE=Release \
                    -DENABLE_SHARED=ON -DENABLE_CLI=OFF -DCMAKE_INSTALL_PREFIX=/usr
              timeout 1200 cmake --build /tmp/x265/build -j"$(nproc)"
              cmake --install /tmp/x265/build

              # libvpx: the distro ships 1.7 and the bindings come from 1.16.
              timeout 180 git clone --depth 1 --branch v1.16.0 \
                https://chromium.googlesource.com/webm/libvpx /tmp/vpx
              ( cd /tmp/vpx && ./configure --prefix=/usr --libdir=/usr/lib \
                  --disable-examples --disable-tools --disable-docs \
                  --disable-unit-tests --disable-install-bins \
                && timeout 900 make -j"$(nproc)" && make install )

              export PKG_CONFIG_PATH=/usr/lib/pkgconfig:/usr/lib64/pkgconfig:$PKG_CONFIG_PATH

              if ! pkg-config --exists SvtAv1Enc; then
                timeout 240 git clone --depth 1 --branch v2.3.0 \
                  https://gitlab.com/AOMediaCodec/SVT-AV1.git /tmp/svt
                cmake -S /tmp/svt -B /tmp/svt/build -DCMAKE_BUILD_TYPE=Release \
                      -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=/usr
                timeout 1200 cmake --build /tmp/svt/build -j"$(nproc)"
                cmake --install /tmp/svt/build
              fi

              echo "x264 $(pkg-config --modversion x264 2>/dev/null || echo MISSING)"
              echo "x265 $(pkg-config --modversion x265 2>/dev/null || echo MISSING)"
              echo "vpx $(pkg-config --modversion vpx 2>/dev/null || echo MISSING)"
              echo "svt $(pkg-config --modversion SvtAv1Enc 2>/dev/null || echo MISSING)"
              case "$(pkg-config --modversion x265 2>/dev/null)" in
                4.2*) ;;
                *) echo "libx265 must be 4.2: the sys crate pins its struct layouts"; exit 1 ;;
              esac
            fi
      - name: mark it as the GPL distribution
        run: |
          # The container built these as root; the conversion rewrites the file
          # and deletes the original, which needs to be ours to delete.
          sudo chown -R "$(id -u):$(id -g)" bindings/python/dist
          python3 scripts/gpl_wheel.py bindings/python/dist/*.whl
          ls -l bindings/python/dist
      - name: the GPL libraries must travel inside the wheel
        # `--auditwheel=repair` bundles them. If it silently did not, the wheel
        # imports only on a machine that already has libx264/libx265 — which is
        # how a "works on the build host" wheel gets published.
        run: |
          for lib in libx264 libx265; do
            if ! unzip -l bindings/python/dist/*.whl | grep -q "$lib"; then
              echo "wheel does not bundle $lib:"
              unzip -l bindings/python/dist/*.whl
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v4
        with:
          name: gpl-wheel-${{ matrix.platform }}
          path: bindings/python/dist/*.whl

  smoke:
    # Installing the wheel and asking what it can encode is the check that
    # matters: a wheel built with the wrong features imports fine and fails at
    # the first frame, after publishing.
    name: gpl smoke (x264 and x265 actually encode)
    needs: [wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/calibrations
          path: calibrations
      - uses: actions/setup-python@v5
        with:
          # The wheels come from the manylinux container, whose interpreter is
          # 3.12, and they are not abi3: a cp312 wheel will not install on 3.11.
          # See PUBLISHING.md — moving to abi3 is what would remove this.
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: gpl-wheel-*
          merge-multiple: true
          path: dist
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install dist/*.whl pytest numpy
      - name: the wheel carries the GPL encoders, and nothing Apache-only is missing
        run: |
          python - <<'PY'
          import blazar
          present = set(blazar.backends())
          print("blazar", blazar.__version__, "backends:", sorted(present))
          missing = {"nvenc", "svtav1", "vp9", "x264", "x265"} - present
          assert not missing, f"GPL wheel is missing {sorted(missing)}; got {sorted(present)}"
          PY
      - name: x264 and x265 produce decodable files
        env:
          BLAZAR_CALIBRATIONS: ${{ github.workspace }}/calibrations/default
        run: |
          python - <<'PY'
          import subprocess, tempfile, numpy as np, blazar
          for backend, codec in (("x264", "h264"), ("x265", "hevc")):
              path = f"{tempfile.mkdtemp()}/{backend}.mp4"
              enc = blazar.Encoder(
                  calibrations=blazar.Calibrations.load(__import__("os").environ["BLAZAR_CALIBRATIONS"]),
                  identity={"family": "wan", "version": "2.1", "quant": "bf16", "size": "1.3b"},
                  target="balanced", backend=backend, codec=codec, output=path,
                  request_id=f"gpl-{backend}")
              for i in range(8):
                  frame = np.zeros((64, 96, 3), dtype=np.uint8)
                  frame[:, :, 0] = (np.arange(96) + i * 8)[None, :] % 256
                  enc.submit(frame, width=96, height=64, fps=24.0, layout="thwc", range="full_u8")
              enc.close()
              probe = subprocess.run(
                  ["ffprobe", "-v", "error", "-count_frames", "-select_streams", "v:0",
                   "-show_entries", "stream=codec_name,nb_read_frames", "-of", "default=nw=1", path],
                  capture_output=True, text=True)
              assert probe.returncode == 0, probe.stderr
              assert f"codec_name={codec}" in probe.stdout, probe.stdout
              assert "nb_read_frames=8" in probe.stdout, probe.stdout
              print(backend, "ok", probe.stdout.replace(chr(10), " "))
          PY
      - name: acceptance suite against this wheel
        env:
          BLAZAR_ACCEPTANCE_FLAVOUR: blazar-video-gpl
          BLAZAR_CALIBRATIONS: ${{ github.workspace }}/calibrations/default
        run: python -m pytest bindings/python/tests/test_acceptance.py -q

  publish:
    # A tag publishes; a manual run builds and verifies, and publishes nothing.
    name: publish (PyPI, GPL)
    needs: [wheels, smoke]
    runs-on: ubuntu-latest
    environment: pypi-gpl
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gpl-wheel-*
          merge-multiple: true
          path: dist
      - run: pip install twine && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
