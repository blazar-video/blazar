name: Release

# Triggered by the tag RELEASING.md describes. Publishes the wheel matrix and,
# after PyPI, the crates. Trusted publishing: no long-lived token in the repo.
#
# No GPL codecs in wheels: x264 and x265 make the resulting binary GPL, and this
# project is Apache-2.0. They stay opt-in source features; see PUBLISHING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (skips publishing when set by hand)"
      testpypi:
        description: "Publish to TestPyPI instead of PyPI (dry run; burns nothing on the real index)"
        type: boolean
        default: true

permissions:
  contents: write     # upload release assets
  id-token: write     # PyPI trusted publishing

jobs:
  wheels:
    name: wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    env:
      # audiopus_sys vendors opus 1.3, whose CMakeLists declares
      # cmake_minimum_required(3.1) — rejected by CMake 4. This is the documented
      # escape hatch and is only about the policy floor, not the C standard.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: manylinux_2_28_x86_64
            args: --release --out dist --features nvenc,gpu-preprocess,enc-svtav1,enc-vp9,opus
            manylinux: "2_28"
          # Native arm runner rather than a cross build: PyO3 without abi3 needs
          # an interpreter of the target architecture, so cross-compiling here
          # would only produce a wheel nothing can import.
          - os: ubuntu-24.04-arm
            platform: manylinux_2_28_aarch64
            args: --release --out dist --features nvenc,gpu-preprocess,enc-svtav1,enc-vp9,opus
            manylinux: "2_28"
          - os: macos-latest
            platform: macosx_11_0_arm64
            args: --release --out dist --features enc-videotoolbox,opus
            manylinux: auto
          # NVENC only: it is dlopened, so the wheel builds and imports on a
          # machine with no driver. libvpx/svt-av1 are not attempted here because
          # their -sys crates need pkg-config metadata that Windows toolchains do
          # not provide out of the box (see RELEASING.md).
          - os: windows-latest
            platform: win_amd64
            args: --release --out dist --features nvenc,gpu-preprocess,opus -i python3.11
            manylinux: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install cmake
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        run: choco install -y cmake --no-progress
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          manylinux: ${{ matrix.manylinux }}
          # The container is minimal. NVENC needs nothing (dlopened), opus builds
          # itself with CMake, and vpx/svt-av1 have to be present at link time.
          before-script-linux: |
            if command -v dnf >/dev/null; then
              dnf install -y cmake gcc gcc-c++ make nasm git clang clang-libs opus-devel || true
              # The distro libvpx is 1.7, and the bindings are generated from
              # 1.16 — the build script refuses anything below 1.15 rather than
              # writing past a shorter struct, so build the version we target.
              git clone --depth 1 --branch v1.16.0 https://chromium.googlesource.com/webm/libvpx /tmp/vpx
              # Subshell: this script shares its shell with maturin, so a `cd`
              # that is not scoped here leaves maturin looking for /Cargo.toml.
              ( cd /tmp/vpx && ./configure --prefix=/usr --libdir=/usr/lib \
                  --disable-examples --disable-tools --disable-docs \
                  --disable-unit-tests --disable-install-bins \
                && make -j"$(nproc)" && make install )
              export PKG_CONFIG_PATH=/usr/lib/pkgconfig:$PKG_CONFIG_PATH
              if ! pkg-config --exists SvtAv1Enc; then
                # AlmaLinux has no svt-av1 package; build it, as the wheel needs
                # it at link time. Install to /usr so its .pc lands in the
                # default pkg-config path rather than somewhere unsearched.
                git clone --depth 1 --branch v2.3.0 https://gitlab.com/AOMediaCodec/SVT-AV1.git /tmp/svt
                cmake -S /tmp/svt -B /tmp/svt/build -DCMAKE_BUILD_TYPE=Release \
                      -DBUILD_SHARED_LIBS=ON -DCMAKE_INSTALL_PREFIX=/usr
                cmake --build /tmp/svt/build -j"$(nproc)"
                cmake --install /tmp/svt/build
                export PKG_CONFIG_PATH=/usr/lib64/pkgconfig:/usr/lib/pkgconfig:$PKG_CONFIG_PATH
              fi
            elif command -v apt-get >/dev/null; then
              apt-get update && apt-get install -y cmake build-essential libvpx-dev libsvtav1-dev
            fi
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: bindings/python/dist/*.whl

  sdist:
    # No GPL codecs here; the sdist exists so a platform without a wheel can
    # still build, and so the Apache distribution carries its own source.
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: bindings/python/dist/*.tar.gz

  smoke:
    # Executes the extension to check what it can actually encode. Built
    # natively rather than in the manylinux container: the container targets its
    # own interpreter, so the wheel it produces cannot be installed on the
    # runner to be tested.
    name: smoke (backends are what we ship)
    runs-on: ubuntu-latest
    env:
      # audiopus_sys vendors opus 1.3, whose CMakeLists declares
      # cmake_minimum_required(3.1) — rejected by CMake 4. This is the documented
      # escape hatch and is only about the policy floor, not the C standard.
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/calibrations
          path: calibrations
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y cmake build-essential ffmpeg libvpx-dev && (sudo apt-get install -y libsvtav1-dev || sudo apt-get install -y libsvtav1enc-dev)
      - run: pip install maturin
      - run: cd bindings/python && maturin build --release --features nvenc,gpu-preprocess,enc-svtav1,enc-vp9,opus --out dist
      - run: pip install bindings/python/dist/*.whl pytest numpy
      - run: |
          python - <<'PY'
          import blazar
          present = set(blazar.backends())
          print("blazar", blazar.__version__, "backends:", sorted(present))
          missing = {"nvenc", "svtav1", "vp9"} - present
          assert not missing, f"wheel is missing {sorted(missing)}; got {sorted(present)}"

          # The Apache wheel must not carry copyleft codecs.
          assert "x264" not in present and "x265" not in present, sorted(present)
          PY
      - name: acceptance suite
        env:
          BLAZAR_ACCEPTANCE_FLAVOUR: blazar-video
          BLAZAR_CALIBRATIONS: ${{ github.workspace }}/calibrations/default
        run: python -m pytest bindings/python/tests/test_acceptance.py -q

  smoke-windows:
    # A Windows wheel cannot be exercised for NVENC on a hosted runner (no GPU),
    # but it can prove the two things the dlopen work exists for: the extension
    # imports without a driver, and asking for NVENC fails with a message rather
    # than a crash or an unresolved symbol.
    name: smoke (windows import + driver refusal)
    needs: [wheels]
    runs-on: windows-latest
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/calibrations
          path: calibrations
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: wheels-win_amd64
          path: dist
      - run: pip install dist/*.whl pytest numpy
        shell: bash  # PowerShell does not expand the glob for native commands
      - run: |
          python - <<'PY'
          import numpy as np
          import blazar
          print("blazar", blazar.__version__, "backends:", sorted(blazar.backends()))
          assert blazar.__version__ != "0.0.0", "the module version did not come from the build"
          assert "nvenc" in blazar.backends(), "the Windows wheel must carry NVENC"

          calibrations = blazar.Calibrations.load("calibrations/default")
          identity = {"family": "wan", "version": "2.1", "quant": "bf16", "size": "1.3b"}
          frame = np.zeros((64, 64, 3), dtype=np.uint8)

          def attempt():
              # The session opens on the first frame, so a missing driver has to
              # surface there: an error naming the driver, not a crash.
              enc = blazar.Encoder(calibrations=calibrations, identity=identity,
                                   target="balanced", backend="nvenc", codec="h264",
                                   output=None, request_id="win-smoke")
              enc.submit(frame, width=64, height=64, fps=24.0, layout="thwc", range="full_u8")

          try:
              attempt()
          except (RuntimeError, ValueError) as exc:
              text = str(exc).lower()
              if "nvenc" not in text and "driver" not in text:
                  raise  # a different failure, and we want its traceback
              print("refused as expected:", type(exc).__name__, str(exc).splitlines()[0])
          else:
              raise SystemExit("NVENC encoded a frame on a runner with no GPU?")
          PY
        shell: bash  # PowerShell does not run a `python - <<'PY'` heredoc
      - name: acceptance suite (skips hardware, runs what this wheel ships)
        env:
          BLAZAR_ACCEPTANCE_FLAVOUR: blazar-video-windows
          BLAZAR_CALIBRATIONS: ${{ github.workspace }}/calibrations/default
        run: python -m pytest bindings/python/tests/test_acceptance.py -q

  publish-pypi:
    needs: [wheels, sdist, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    # A tag publishes for real; a manual run goes to TestPyPI by default, so the
    # workflow can be rehearsed without spending a version number.
    # A tag publishes for real; a manual run publishes to TestPyPI, which the
    # input controls. The real-PyPI step below is gated on the tag, so a branch
    # can never reach it.
    if: startsWith(github.ref, 'refs/tags/') || inputs.testpypi == true
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: pip install twine && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/')
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-crates:
    # Opt-in per repository: publishing the workspace crates is a separate
    # commitment from shipping a wheel, and 0.1 does not make it. Set the
    # repository variable PUBLISH_CRATES=true when the crate API is what you are
    # releasing.

    needs: publish-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_CRATES == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # In dependency order: crates.io rejects a publish whose dependency is not
      # there yet, and waits are cheaper than a half-published workspace.
      - run: |
          for crate in blazar-core blazar-calibration blazar-sink blazar-preprocess blazar-encoder blazar-runtime; do
            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN" || exit 1
            sleep 30
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-notes:
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_CRATES == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: gh release create "${GITHUB_REF_NAME}" dist/*.whl --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
