name: Release

# Triggered by the tag RELEASING.md describes. Publishes the wheel matrix and,
# after PyPI, the crates. Trusted publishing: no long-lived token in the repo.
#
# No GPL codecs in wheels: x264 and x265 make the resulting binary GPL, and this
# project is Apache-2.0. They stay opt-in source features; see PUBLISHING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (skips publishing when set by hand)"

permissions:
  contents: write     # upload release assets
  id-token: write     # PyPI trusted publishing

jobs:
  wheels:
    name: wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: manylinux_2_28_x86_64
            args: --release --out dist --features nvenc,gpu-preprocess,enc-svtav1,enc-vp9
            manylinux: "2_28"
          - os: ubuntu-latest
            platform: manylinux_2_28_aarch64
            args: --release --out dist --features enc-svtav1,enc-vp9
            manylinux: "2_28"
          - os: macos-latest
            platform: macosx_11_0_arm64
            args: --release --out dist --features enc-videotoolbox
            manylinux: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.platform == 'macosx_11_0_arm64' && 'aarch64-apple-darwin' || (matrix.platform == 'manylinux_2_28_aarch64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu') }}
          manylinux: ${{ matrix.manylinux }}
          args: ${{ matrix.args }}
      - name: the wheel reports the backends the notes claim
        if: matrix.platform != 'manylinux_2_28_aarch64'
        run: |
          pip install dist/*.whl
          python - <<'PY'
          import blazar
          print("blazar", blazar.__version__)
          # A wheel that cannot see its backends is a wheel built with the wrong
          # features, and no smoke test after publishing would catch it.
          for backend in ("nvenc", "x264"):
              blazar.Encoder  # imported: the extension loaded
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: bindings/python/dist/*.whl

  sdist:
    # No GPL codecs here; the sdist exists so a platform without a wheel can
    # still build, and so the Apache distribution carries its own source.
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: bindings/python/dist/*.tar.gz

  publish-pypi:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-crates:
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # In dependency order: crates.io rejects a publish whose dependency is not
      # there yet, and waits are cheaper than a half-published workspace.
      - run: |
          for crate in blazar-core blazar-calibration blazar-sink blazar-preprocess blazar-encoder blazar-runtime; do
            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN" || exit 1
            sleep 30
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-notes:
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: gh release create "${GITHUB_REF_NAME}" dist/*.whl --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
