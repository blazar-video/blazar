name: Release

# Triggered by the tag RELEASING.md describes. Publishes the wheel matrix and,
# after PyPI, the crates. Trusted publishing: no long-lived token in the repo.
#
# No GPL codecs in wheels: x264 and x265 make the resulting binary GPL, and this
# project is Apache-2.0. They stay opt-in source features; see PUBLISHING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (skips publishing when set by hand)"
      testpypi:
        description: "Publish to TestPyPI instead of PyPI (dry run; burns nothing on the real index)"
        type: boolean
        default: true

permissions:
  contents: write     # upload release assets
  id-token: write     # PyPI trusted publishing

jobs:
  wheels:
    name: wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: manylinux_2_28_x86_64
            args: --release --out dist --features enc-svtav1,enc-vp9,opus
            manylinux: "2_28"
          - os: ubuntu-latest
            platform: manylinux_2_28_aarch64
            args: --release --out dist --features enc-svtav1,enc-vp9,opus
            manylinux: "2_28"
          - os: macos-latest
            platform: macosx_11_0_arm64
            args: --release --out dist --features enc-videotoolbox,opus
            manylinux: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.platform == 'macosx_11_0_arm64' && 'aarch64-apple-darwin' || (matrix.platform == 'manylinux_2_28_aarch64' && 'aarch64-unknown-linux-gnu' || 'x86_64-unknown-linux-gnu') }}
          manylinux: ${{ matrix.manylinux }}
          # The container is minimal: libopus and pkg-config have to be there
          # before cargo resolves the opus-sys build script.
          before-script-linux: |
            if command -v apt-get >/dev/null; then
              apt-get update && apt-get install -y libopus-dev pkg-config
            fi
          args: ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: bindings/python/dist/*.whl

  sdist:
    # No GPL codecs here; the sdist exists so a platform without a wheel can
    # still build, and so the Apache distribution carries its own source.
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: bindings/python/dist/*.tar.gz

  smoke:
    # Executes the extension to check what it can actually encode. Built
    # natively rather than in the manylinux container: the container targets its
    # own interpreter, so the wheel it produces cannot be installed on the
    # runner to be tested.
    name: smoke (backends are what we ship)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: sudo apt-get install -y libopus-dev pkg-config && pip install maturin
      - run: cd bindings/python && maturin build --release --features enc-svtav1,enc-vp9,opus --out dist
      - run: pip install bindings/python/dist/*.whl
      - run: |
          python - <<'PY'
          import blazar
          present = set(blazar.backends())
          print("blazar", blazar.__version__, "backends:", sorted(present))
          missing = {"svtav1", "vp9", "opus"} - present
          assert not missing, f"wheel is missing {sorted(missing)}; got {sorted(present)}"
          # The Apache wheel must not carry copyleft codecs, and NVENC is a
          # source build: cudarc needs CUDA headers, which the manylinux image
          # does not have.
          assert "x264" not in present and "x265" not in present, sorted(present)
          assert "nvenc" not in present, sorted(present)
          PY

  publish-pypi:
    needs: [wheels, sdist, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    # A tag publishes for real; a manual run goes to TestPyPI by default, so the
    # workflow can be rehearsed without spending a version number.
    if: startsWith(github.ref, 'refs/tags/') || inputs.testpypi == false
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: pip install twine && twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: startsWith(github.ref, 'refs/tags/')
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-crates:
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # In dependency order: crates.io rejects a publish whose dependency is not
      # there yet, and waits are cheaper than a half-published workspace.
      - run: |
          for crate in blazar-core blazar-calibration blazar-sink blazar-preprocess blazar-encoder blazar-runtime; do
            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN" || exit 1
            sleep 30
          done
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-notes:
    needs: publish-pypi
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - run: gh release create "${GITHUB_REF_NAME}" dist/*.whl --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
